[package]
name = "zkindle"
version = "0.1.0"
edition = "2024"
description = "ZKindle: an offline multi-coin wallet (Zcash shielded, Bitcoin, Ethereum) for a jailbroken Kindle"
license = "MIT OR Apache-2.0"

[dependencies]
zfirm-core = { path = "../zfirm/core", features = ["english"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
getrandom = "0.2"
argon2 = "0.5"
aes-gcm = "0.10"
png = "0.17"
font8x8 = "0.3"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

