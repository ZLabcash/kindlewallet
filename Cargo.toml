[package]
name = "kindlewallet"
version = "0.1.0"
edition = "2024"
description = "KindleWallet: an offline multi-coin wallet (BTC, ETH and 24 EVM networks, ZEC, SOL, XMR, TRX, XRP, SUI, APT, NEAR, XLM, TON, ADA, STRK, TAO, Quantus) for a jailbroken Kindle"
license = "MIT OR Apache-2.0"

[dependencies]
zfirm-core = { path = "../zfirm/core", features = ["english"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
getrandom = "0.2"
argon2 = "0.5"
aes-gcm = "0.10"
png = "0.17"
font8x8 = "0.3"
zeroize = "1"
libc = "0.2"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
bs58 = "0.5"
crc32fast = "1"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
qp-poseidon-core = { version = "=3.1.0", default-features = false }
blake2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
schnorrkel = { version = "0.11", default-features = false, features = ["alloc"] }
starknet-crypto = { version = "0.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
orchard = { version = "0.15", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

